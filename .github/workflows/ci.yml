name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Ubuntu Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Apple clang
            os: macos-latest
            cc: cc
            cxx: c++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Round-trip the corpus with sseqtool
        run: ./build/sseqtool roundtrip tests/data/app/*.WRK tests/data/mid2wrk/*.WRK
      - name: Swift package (macOS)
        if: runner.os == 'macOS'
        run: swift build -c release

  lint:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang clang-format clang-tidy
      - name: clang-format
        run: |
          clang-format --dry-run --Werror include/sseq/*.hpp include/sseq/*.h src/*.cpp src/*.hpp tools/*.cpp \
            tests/*.cpp tests/*.c tests/*.hpp tests/corpus/*.cpp tests/corpus/*.hpp swift/include/*.h
      - name: Configure with compile commands
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        env:
          CC: clang
          CXX: clang++
      - name: clang-tidy
        run: |
          clang-tidy -p build --warnings-as-errors='*' src/*.cpp tools/*.cpp \
            tests/*.cpp tests/corpus/*.cpp
